# CI/CD for the Smart City backend.
#  - Every push and pull request to main: install, generate Prisma client, build (catches compile errors).
#  - Push to main (or "Run workflow" by hand): if the build passes, deploy to the Contabo server over SSH.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST         62.169.19.139
#   DEPLOY_USER         deploy
#   DEPLOY_SSH_KEY      private key whose public half is the forced-command key on the server
#   DEPLOY_KNOWN_HOSTS  the server's host key line, e.g. "62.169.19.139 ssh-ed25519 AAAA..."

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma's config may read DATABASE_URL; generate never connects, so a placeholder is enough
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma7.config.ts ]; then
            npx prisma generate --config prisma7.config.ts
          else
            npx prisma generate
          fi

      - name: Build
        run: npm run build

      # Uncomment once the project has tests that pass:
      # - name: Test
      #   run: npm test

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.smartcomplaint.online/api/v1
    # A newer push waits for the running deploy instead of cancelling it halfway
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # The server runs deploy/deploy.sh for this key no matter what command is sent
        run: |
          ssh -T -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$HOST"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
